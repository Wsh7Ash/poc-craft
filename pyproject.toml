[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-craft"
version = "1.0.0"
description = "Craft minimal, reproducible proof-of-concept artifacts: 50 validated skills, a ddmin minimiser and a harness generator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["proof-of-concept", "ddmin", "minimisation", "bug-bounty", "harness", "skills"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poc-craft = "poccraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
